
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetroMind</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8ff;color:#14243d;font-family:Arial,sans-serif}
header{background:white;padding:18px 6%;font-size:23px;font-weight:bold}
.logo{background:#1769e8;color:white;padding:9px 12px;border-radius:10px;margin-right:8px}
main{max-width:800px;margin:auto;padding:30px 6%}
h1{font-size:30px}
.muted{color:#718096;line-height:1.5}
.panel{background:white;border:1px solid #e0e7f1;border-radius:17px;padding:20px;margin-top:20px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input{width:100%;padding:14px;border:1px solid #dce4ef;border-radius:10px;font-size:16px}
button{background:#1769e8;color:white;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{width:100%;margin-top:18px}
#result{display:none;background:#eaf2ff;padding:18px;border-radius:14px;margin-top:18px;line-height:1.7}
.stop{padding:10px;border-left:3px solid #1769e8;margin:8px 0 8px 7px}
footer{text-align:center;color:#8491a4;padding:30px;font-size:13px}
</style>
</head>
<body>
<header><span class="logo">M</span>MetroMind</header>
<main>
<p style="color:#1769e8;font-weight:bold">YOUR JOURNEY. YOUR TIME. YOUR PEACE OF MIND.</p>
<h1>Plan your journey</h1>
<p class="muted">Find a route between stations.</p>

<div class="panel">
<label for="from">Starting station</label>
<input id="from" list="stations" placeholder="Enter starting station">
<label for="to">Destination station</label>
<input id="to" list="stations" placeholder="Enter destination station">
<datalist id="stations">
<option>Rajiv Chowk</option>
<option>New Delhi</option>
<option>Chandni Chowk</option>
<option>Chawri Bazar</option>
<option>Kashmere Gate</option>
<option>Central Secretariat</option>
<option>Patel Chowk</option>
<option>Udyog Bhawan</option>
<option>AIIMS</option>
<option>Hauz Khas</option>
</datalist>
<button class="primary" onclick="calculateRoute()">Calculate route →</button>
<div id="result"></div>
</div>

<p class="muted">Prototype notice: This is an illustrative sample network, not an official or complete Delhi Metro route planner. Confirm actual routes with DMRC before travelling.</p>
</main>
<footer>MetroMind © 2026</footer>

<script>
const network={
"Rajiv Chowk":["New Delhi","Patel Chowk"],
"New Delhi":["Rajiv Chowk","Chandni Chowk"],
"Chandni Chowk":["New Delhi","Chawri Bazar"],
"Chawri Bazar":["Chandni Chowk","Kashmere Gate"],
"Kashmere Gate":["Chawri Bazar"],
"Patel Chowk":["Rajiv Chowk","Central Secretariat"],
"Central Secretariat":["Patel Chowk","Udyog Bhawan","AIIMS"],
"Udyog Bhawan":["Central Secretariat"],
"AIIMS":["Central Secretariat","Hauz Khas"],
"Hauz Khas":["AIIMS"]
};

function calculateRoute(){
 const start=document.getElementById("from").value.trim();
 const end=document.getElementById("to").value.trim();
 const result=document.getElementById("result");
 result.style.display="block";

 if(!network[start]||!network[end]){
 result.textContent="Please select stations from the available demo station list.";
 return;
 }
 if(start===end){
 result.textContent="Please select two different stations.";
 return;
 }

 const queue=[[start]],visited=new Set([start]);
 let route=null;

 while(queue.length){
 const path=queue.shift();
 const current=path[path.length-1];
 if(current===end){route=path;break;}
 for(const next of network[current]){
 if(!visited.has(next)){
 visited.add(next);
 queue.push([...path,next]);
 }
 }
 }

 if(!route){
 result.textContent="No connected route found in this sample network.";
 return;
 }

 result.innerHTML="<h2>Route found!</h2><p><b>From:</b> "+escapeText(start)+"</p><p><b>To:</b> "+escapeText(end)+"</p><p><b>Stops:</b> "+(route.length-1)+"</p><h3>Journey sequence</h3>"+route.map((s,i)=>"<div class='stop'>"+(i+1)+". "+escapeText(s)+"</div>").join("")+"<p><b>Note:</b> Sample route only. No official line, interchange or timing verification.</p>";
}
function escapeText(s){
 return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
